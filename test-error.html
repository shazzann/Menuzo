<!DOCTYPE html>
<html>
<head>
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color:red">Error: ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="color:red">Promise Error: ' + e.reason + '</div>';
    });
  </script>
</head>
<body>
  <h1>Test Error Catching</h1>
  <script type="module" src="http://localhost:5173/src/main.tsx"></script>
</body>
</html>
